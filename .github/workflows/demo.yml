name: Demo

on:
  push:
    branches:
      - master
      # The branch consumers use (uses: mapped/ssh-agent@git-repo-mapping).
      - git-repo-mapping
  pull_request:

jobs:
  single_key_demo:
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup key
        uses: ./
        with:
          ssh-private-key: |
            ${{ secrets.DEMO_KEY }}
            ${{ secrets.DEMO_KEY_2 }}

  multiple_keys_demo:
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup key
        uses: ./
        with:
          ssh-private-key: ${{ secrets.DEMO_KEY }}
